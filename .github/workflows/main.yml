name: Todo App CI/CD

on:
  push:
    branches: [ Devops ]

permissions:
  contents: write

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:

  build_and_push_backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/todo-backend:${{ env.IMAGE_TAG }}

  build_and_push_frontend:
    runs-on: ubuntu-latest
    needs: build_and_push_backend

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/todo-frontend:${{ env.IMAGE_TAG }}

  update_k8s_manifests:
    runs-on: ubuntu-latest
    needs:
      - build_and_push_backend
      - build_and_push_frontend

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install yq
        run: |
          sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      - name: Update backend image
        run: |
          yq -i '
            (.spec.template.spec.containers[] | select(.name=="backend") | .image)
            = "${{ vars.DOCKERHUB_USERNAME }}/todo-backend:${{ env.IMAGE_TAG }}"
          ' k8s/backend.yaml

      - name: Update frontend image
        run: |
          yq -i '
            (.spec.template.spec.containers[] | select(.name=="frontend") | .image)
            = "${{ vars.DOCKERHUB_USERNAME }}/todo-frontend:${{ env.IMAGE_TAG }}"
          ' k8s/frontend.yaml

      - name: Commit & Push Updated Manifests
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add k8s/backend.yaml k8s/frontend.yaml
          git commit -m "chore: update images to ${{ env.IMAGE_TAG }}" || echo "No changes"
          git push

  notify:
    runs-on: ubuntu-latest
    needs:
      - build_and_push_backend
      - build_and_push_frontend
      - update_k8s_manifests
    if: always()

    steps:
      - name: Slack Notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          fields: repo,message,commit,author,action,eventName,ref,workflow
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
