name: Todo App DevSecOps CI/CD

on:
  push:
    branches:
      - main
      - Devops

permissions:
  contents: write

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:

  compile:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Backend Syntax Check
        run: |
          cd backend
          find . -name "*.js" -exec node --check {} +

      - name: Frontend Syntax Check
        run: |
          cd frontend
          find . -name "*.js" -exec node --check {} +


  gitleaks_scan:
    runs-on: ubuntu-latest
    needs: compile

    steps:
      - uses: actions/checkout@v4
      - uses: gitleaks/gitleaks-action@v2


  trivy_fs_scan:
    runs-on: ubuntu-latest
    needs: gitleaks_scan

    steps:
      - uses: actions/checkout@v4

      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          ignore-unfixed: true
          severity: CRITICAL,HIGH


  build_backend:
    runs-on: ubuntu-latest
    needs: trivy_fs_scan

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/todo-backend:${{ env.IMAGE_TAG }}


  build_frontend:
    runs-on: ubuntu-latest
    needs: build_backend

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/todo-frontend:${{ env.IMAGE_TAG }}


  trivy_image_scan:
    runs-on: ubuntu-latest
    needs:
      - build_backend
      - build_frontend

    steps:
      - name: Scan Backend Image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: ${{ vars.DOCKERHUB_USERNAME }}/todo-backend:${{ env.IMAGE_TAG }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Scan Frontend Image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: ${{ vars.DOCKERHUB_USERNAME }}/todo-frontend:${{ env.IMAGE_TAG }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true


  update_k8s_manifests:
    runs-on: ubuntu-latest
    needs: trivy_image_scan
    if: github.ref == 'refs/heads/Devops'

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install yq
        run: |
          sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      - name: Update Backend Image
        run: |
          yq -i '
            (.spec.template.spec.containers[] | select(.name=="backend") | .image)
            = "${{ vars.DOCKERHUB_USERNAME }}/todo-backend:${{ env.IMAGE_TAG }}"
          ' k8s/backend.yaml

      - name: Update Frontend Image
        run: |
          yq -i '
            (.spec.template.spec.containers[] | select(.name=="frontend") | .image)
            = "${{ vars.DOCKERHUB_USERNAME }}/todo-frontend:${{ env.IMAGE_TAG }}"
          ' k8s/frontend.yaml

      - name: Commit & Push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add k8s/backend.yaml k8s/frontend.yaml
          git commit -m "Update images to ${{ env.IMAGE_TAG }}" || echo "No changes"
          git push


  notify:
    runs-on: ubuntu-latest
    needs:
      - compile
      - gitleaks_scan
      - trivy_fs_scan
      - build_backend
      - build_frontend
      - trivy_image_scan
      - update_k8s_manifests
    if: always()

    steps:
      - name: Slack Notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          fields: repo,message,commit,author,action,eventName,ref,workflow
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
